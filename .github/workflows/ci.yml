name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ingestion

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_dev_only
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://relay:relay_dev_only@localhost:5432/relay

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: apps/ingestion/go.sum

      - name: Build
        run: go build ./...

      - name: Install golangci-lint
        run: |
          mkdir -p $HOME/.local/bin
          export GOBIN=$HOME/.local/bin
          export PATH=$GOBIN:$PATH
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: golangci-lint run

      - name: Run database migrations
        run: go run ./cmd/migrate

      - name: Test
        run: go test -p 1 ./...