name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    needs: [build-lint-test]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f apps/ingestion/Dockerfile.server -t relay-server:scan apps/ingestion

      - name: Build processor image
        run: docker build -f apps/ingestion/Dockerfile.processor -t relay-processor:scan apps/ingestion

      - name: Build dashboard image
        run: docker build -f apps/dashboard/Dockerfile -t relay-dashboard:scan apps/dashboard

      # PINNED TO A COMMIT SHA, NOT A VERSION TAG — aquasecurity/trivy-action
      # had 76 of 77 release tags compromised via a supply-chain attack in
      # March 2026 (tags repointed to a credential-stealing payload that
      # ran silently before the real scanner). A mutable tag is not a safe
      # SHA verified via `git ls-remote ...refs/tags/v0.36.0^{}` (dereferenced
      # commit, not the tag object) on 2026-08-27.

      - name: Scan server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: relay-server:scan
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Scan processor image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: relay-processor:scan
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Scan dashboard image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: relay-dashboard:scan
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  mcp-server-build-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-server

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_dev_only
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  dashboard-build-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build (type-checks via tsc -b, then bundles)
        run: pnpm run build
        
  build-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ingestion

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_dev_only
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://relay:relay_dev_only@localhost:5432/relay

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: apps/ingestion/go.sum

      - name: Build
        run: go build ./...

      - name: Install golangci-lint
        run: |
          mkdir -p $HOME/.local/bin
          export GOBIN=$HOME/.local/bin
          export PATH=$GOBIN:$PATH
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: golangci-lint run

      - name: Run database migrations
        run: go run ./cmd/migrate

      - name: Test
        run: go test -p 1 ./...