services:
  postgres:
    image: postgres:18-alpine
    container_name: relay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_dev_only
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - relay_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


volumes:
  relay_pgdata:
